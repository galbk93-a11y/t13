<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תרגול: אחד חלקי פונקציה ושורש של פונקציה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3f8; --paper:#fbfdff; --paper2:#f1f6fb; --ink:#17243d; --muted:#5a6982; --line:#d5dfeb;
  --fc:#2a64b5; --gc:#c0185a; --gcSoft:#fbe3ec; --hc:#6a3fb5; --hcSoft:#ece4fa; --ok:#23784a; --okSoft:#e2f3e9;
  --grid:#e3ebf4; --axis:#33425c; --sel:#17243d; --selInk:#fbfdff;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1520; --paper:#162030; --paper2:#1c283a; --ink:#e6edf7; --muted:#9caccc; --line:#2a3850;
    --fc:#74a9ff; --gc:#ff6fa3; --gcSoft:#3a1a29; --hc:#b896ff; --hcSoft:#2a2143; --ok:#6fd49c; --okSoft:#15301f;
    --grid:#213048; --axis:#b4c2da; --sel:#e6edf7; --selInk:#0f1520; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1520; --paper:#162030; --paper2:#1c283a; --ink:#e6edf7; --muted:#9caccc; --line:#2a3850;
  --fc:#74a9ff; --gc:#ff6fa3; --gcSoft:#3a1a29; --hc:#b896ff; --hcSoft:#2a2143; --ok:#6fd49c; --okSoft:#15301f;
  --grid:#213048; --axis:#b4c2da; --sel:#e6edf7; --selInk:#0f1520; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.65}
.wrap{max-width:940px;margin:0 auto;padding:20px 16px 48px}
h1,h2,h3{font-family:"Secular One","Assistant",system-ui,sans-serif;font-weight:400;margin:0}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:8px 0 16px;border-bottom:2px solid var(--ink)}
header h1{font-size:clamp(1.55rem,4.5vw,2.25rem);line-height:1.15}
header p{margin:6px 0 0;color:var(--muted)}
.mark{font-size:clamp(1.9rem,6vw,2.8rem);line-height:1;display:flex;gap:22px;align-items:center;direction:ltr}
.mark .m{font-size:1em}
.mark .mg{color:var(--gc)} .mark .mh{color:var(--hc)}
.mark .m .fr{font-size:.8em;vertical-align:-.55em}
.mark .m .fr>span:first-child{border-bottom-width:2px}
.mark .m .sq .rc{border-top-width:2px;padding-top:.22em;padding-left:.16em}
.mark .m .sq .rs path{stroke-width:2}
.m{font-family:"STIX Two Text","Cambria Math","Cambria","Times New Roman",serif;font-size:1.12em;font-weight:400;direction:ltr;unicode-bidi:isolate;white-space:nowrap;font-variant-numeric:lining-nums}
.m var{font-style:italic}
.m .op{margin:0 .22em}
.m .cm{margin-right:.28em}
.m sup{font-size:.68em;vertical-align:.6em;line-height:0;margin-left:.04em}
.m .fr{display:inline-block;text-align:center;vertical-align:-.52em;font-size:.84em;line-height:1.12;margin:0 .1em}
.m .fr>span{display:block}
.m .fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .15em .04em}
.m .fr>span:last-child{padding:.04em .15em 0}
.m .sq{display:inline-block;position:relative;padding-left:.62em;margin-left:.04em;line-height:1.1;vertical-align:baseline}
.m .sq .rs{position:absolute;left:0;top:0;width:.66em;height:100%;overflow:visible}
.m .sq .rs path{fill:none;stroke:currentColor;stroke-width:1.15;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.m .sq .rc{display:inline-block;border-top:1.15px solid currentColor;padding:.17em .12em 0 .12em;line-height:1.1}

.tabs{display:flex;gap:4px;margin:18px 0 0;border-bottom:1.5px solid var(--line);overflow-x:auto}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:.35em;font:inherit;font-weight:700;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px 9px;cursor:pointer;margin-bottom:-1.5px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.view[hidden]{display:none}

.pills{display:flex;gap:6px;overflow-x:auto;padding:14px 2px 8px;scrollbar-width:thin}
.pill{flex:0 0 auto;min-width:42px;height:40px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
.pill[aria-current="true"]{border-color:var(--ink);background:var(--sel);color:var(--selInk)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px clamp(14px,3vw,28px) 24px;margin-top:6px}
.exhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.exhead h2{font-size:1.5rem}
.intro{margin:8px 0 4px;color:var(--muted)}
.figure{margin:10px 0 4px;border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden}
.figcap{font-size:.88rem;color:var(--muted);padding:6px 12px;border-top:1px solid var(--line);background:var(--paper2)}
svg.plot{display:block;width:100%;height:auto;direction:ltr}
svg .pbg{fill:var(--paper)}
svg .grid{stroke:var(--grid);stroke-width:1}
svg .axis{stroke:var(--axis);stroke-width:1.4}
svg .tick{fill:var(--muted);font:13px "STIX Two Text","Times New Roman",serif}
svg .axname{fill:var(--axis);font:italic 17px "STIX Two Text","Times New Roman",serif}
svg .asy{stroke:var(--muted);stroke-width:1.4;stroke-dasharray:6 5}
svg .asylab{fill:var(--muted);font:15px "STIX Two Text","Cambria Math","Times New Roman",serif}
svg .cf{fill:none;stroke:var(--fc);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
svg .cg{fill:none;stroke:var(--gc);stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
svg .ch{fill:none;stroke:var(--hc);stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
svg .cfaint{fill:none;stroke:var(--fc);stroke-width:1.6;stroke-dasharray:5 5;opacity:.55}
svg .ptf{fill:var(--fc)} svg .ptg{fill:var(--gc)} svg .pth{fill:var(--hc)}
svg .holef{fill:var(--paper);stroke:var(--fc);stroke-width:2.2}
svg .holeg{fill:var(--paper);stroke:var(--gc);stroke-width:2.2}
svg .holeh{fill:var(--paper);stroke:var(--hc);stroke-width:2.2}
svg .plab{fill:var(--ink);font:600 15px "STIX Two Text","Cambria Math","Times New Roman",serif;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}

.formula{direction:ltr;display:inline-flex;align-items:center;font-size:1.2rem}

.sec{margin-top:22px;border-radius:12px;border:1.5px solid var(--acc);overflow:hidden}
.sec.inv{--acc:var(--gc);--accSoft:var(--gcSoft)} .sec.sqrt{--acc:var(--hc);--accSoft:var(--hcSoft)}
.sechead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--accSoft);border-bottom:1.5px solid var(--acc)}
.secl{font-family:"Secular One","Assistant",sans-serif;font-size:1.25rem;color:var(--acc)}
.sechead .formula{color:var(--acc)}
.sec .qs{padding:0 16px}
.sec .q:last-child{border-bottom:0}
.qs{margin-top:0}
.q{padding:12px 0;border-bottom:1px solid var(--line)}
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qn{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700}
.qt{flex:1 1 180px;font-weight:700;font-size:1.05rem}
.btns{display:flex;gap:8px}
.btn{font:inherit;font-weight:600;font-size:.95rem;padding:5px 14px;border-radius:999px;cursor:pointer;border:1.5px solid var(--ok);background:transparent;color:var(--ok)}
.btn.how{border-color:var(--acc);color:var(--acc)}
.btn[aria-expanded="true"]{background:var(--ok);color:var(--paper)}
.btn.how[aria-expanded="true"]{background:var(--acc);color:var(--paper)}
.qs.inv{--acc:var(--gc);--accSoft:var(--gcSoft)} .qs.sqrt{--acc:var(--hc);--accSoft:var(--hcSoft)}
.panel{margin:10px 0 2px;padding:10px 14px;border-radius:8px;border-inline-start:4px solid var(--ok);background:var(--okSoft)}
.panel.how{border-inline-start-color:var(--acc);background:var(--accSoft)}
.panel[hidden]{display:none}
.panel ol{margin:4px 0;padding-inline-start:1.3em}
.panel li{margin:3px 0}
.tag{font-size:.82rem;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:.9rem;margin:8px 2px 0;color:var(--muted)}
.legend i{display:inline-block;width:26px;height:0;border-top:3px solid var(--acc);vertical-align:middle;margin-inline-end:6px}
.legend i.f{border-top:2px dashed var(--fc);opacity:.7}
.legend i.f.solid{border-top:3px solid var(--fc);opacity:1}
.nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
.nav button{font:inherit;font-weight:700;padding:8px 18px;border-radius:999px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid var(--fc);outline-offset:2px}

/* summary */
.sum{margin-top:16px}
.sumhead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px clamp(14px,3vw,26px);border-radius:14px;background:var(--accSoft);border:1.5px solid var(--acc)}
.sum.inv{--acc:var(--gc);--accSoft:var(--gcSoft)} .sum.sqrt{--acc:var(--hc);--accSoft:var(--hcSoft)}
.sumhead h2{font-size:1.45rem}
.sumhead p{margin:4px 0 0;color:var(--muted)}
.sumhead .formula{font-size:1.6rem;color:var(--acc)}
.big{margin:14px 0;padding:12px 16px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
.big b{color:var(--acc)}
.rows{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:150px 1fr;gap:6px 18px;padding:14px clamp(14px,3vw,22px);border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row h3{font-size:1.05rem;color:var(--acc);padding-top:1px}
.row .rule{font-weight:600}
.row .why{color:var(--muted);font-size:.95rem;margin-top:3px}
.row .why::before{content:"למה? ";font-weight:700}
.row .note{font-size:.95rem;margin-top:4px}
.row .note::before{content:"שימו לב: ";font-weight:700}
.row ul{margin:4px 0 0;padding-inline-start:1.2em}
.row li{margin:2px 0}
table.mini{border-collapse:collapse;margin-top:6px;font-size:.95rem;width:100%;max-width:440px}
table.mini th,table.mini td{border:1px solid var(--line);padding:5px 10px;text-align:start}
table.mini th{background:var(--paper2);font-weight:700}
.example{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px}
.example h3{font-size:1.05rem;margin:2px 4px 6px}
@media (max-width:620px){.row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.panel{animation:drop .18s ease-out}@keyframes drop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>אחד חלקי פונקציה ושורש של פונקציה</h1>
      <p>בכל תרגיל נתון גרף של <span class="m">f(x)</span>. חקרו בעזרתו את <span class="m">h(x) = √f(x)</span> ואת <span class="m">g(x) = 1/f(x)</span>.</p>
    </div>
    <div class="mark" aria-hidden="true"><span class="m mg">1/f</span><span class="m mh">√f</span></div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="ex" aria-selected="true">תרגילים</button>
    <button class="tab" role="tab" data-view="inv" aria-selected="false" aria-label="סיכום: אחד חלקי פונקציה">סיכום: <span class="m">1/f(x)</span></button>
    <button class="tab" role="tab" data-view="sqrt" aria-selected="false" aria-label="סיכום: שורש של פונקציה">סיכום: <span class="m">√f(x)</span></button>
  </div>

  <section class="view" id="v-ex">
    <div class="pills" id="pills" aria-label="בחירת תרגיל"></div>
    <main class="card" id="card"></main>
  </section>
  <section class="view sum inv" id="v-inv" hidden></section>
  <section class="view sum sqrt" id="v-sqrt" hidden></section>
</div>

<script>
const S2=Math.SQRT2,S3=Math.sqrt(3);
/* each exercise: f graph + two parts. inv = g(x)=1/f(x), sqrt = h(x)=√f(x) */
const E=[
/* 1 */
{f:x=>(x-1)*(x-3),fx:[-1.5,5.5],fy:[-2.5,5],
 fF:{pts:[[1,0,'(1,0)','bl'],[3,0,'(3,0)','br'],[2,-1,'(2,−1)','b'],[0,3,'(0,3)','tr']]},
 inv:{y:[-3.5,3.5],B:[1,3],F:{va:[[1,'x=1'],[3,'x=3']],ha:[[0,'y=0']],pts:[[2,-1,'(2,−1)','b'],[0,1/3,'(0,⅓)','tl']]},q:{
  domain:[`[[x≠1]], [[x≠3]]`,`[[1/f]] מוגדרת כאשר f מוגדרת <b>וגם</b> [[f(x)≠0]] (אסור לחלק ב־0).<br>f מוגדרת לכל x ומתאפסת ב־[[x=1]] וב־[[x=3]] — מוציאים אותן.`],
  sign:[`חיובית: [[x<1]] או [[x>3]]<br>שלילית: [[1<x<3]]`,`המונה 1 חיובי, ולכן ל־g <b>אותו סימן</b> כמו ל־f. ל־g אין אפסים — שבר שהמונה שלו 1 לעולם אינו 0.`],
  asym:[`אנכיות: [[x=1]], [[x=3]]<br>אופקית: [[y=0]]`,`<b>אנכיות:</b> באפסים של f המכנה שואף ל־0 ולכן [[g→±∞]]. הכיוון לפי סימן f: משמאל ל־1 [[g→+∞]], מימין [[g→−∞]]; משמאל ל־3 [[g→−∞]], מימין [[g→+∞]].<br><b>אופקית:</b> [[f→+∞]] בשני הקצוות, ולכן [[g→0]] (מעל ציר x).`],
  ext:[`מקסימום: [[(2, −1)]]`,`כש־f יורדת g עולה, וכש־f עולה g יורדת. לכן המינימום של f [[(2, −1)]] הופך ל<b>מקסימום</b> של g באותו x, בגובה [[1/(−1) = −1]] (הנקודה לא זזה כי [[f=−1]]).`],
  sketch:`<ol><li>שרטטו בקו מקווקו את [[x=1]], [[x=3]], [[y=0]].</li><li>סמנו את המקסימום [[(2, −1)]] ואת [[(0, ⅓)]] (כי [[f(0)=3]]).</li><li>[[x<1]]: g חיובית, יוצאת מ־0 ועולה ל־[[+∞]].</li><li>[[1<x<3]]: g שלילית — עולה מ־[[−∞]] עד [[(2, −1)]] ויורדת שוב ל־[[−∞]].</li><li>[[x>3]]: g יורדת מ־[[+∞]] לכיוון 0.</li></ol>`}},
 sqrt:{y:[-1,4],X:[1,3],F:{pts:[[1,0,'(1,0)','b'],[3,0,'(3,0)','b'],[0,S3,'(0,√3)','tr'],[4,S3,'(4,√3)','tl']]},q:{
  domain:[`[[x≤1]] או [[x≥3]]`,`צריך [[f(x) ≥ 0]]. f מעל ציר x משמאל ל־1 ומימין ל־3, ומתאפסת ב־1 וב־3 (נכללים). בין 1 ל־3 f שלילית.`],
  sign:[`חיובית: [[x<1]] או [[x>3]]<br>מתאפסת: [[x=1]], [[x=3]]<br>שלילית: אין`,`[[√f>0]] היכן ש־[[f>0]], ו־[[√f=0]] היכן ש־[[f=0]]. שורש לעולם אינו שלילי.`],
  asym:[`אין אסימפטוטות`,`ל־f אין אסימפטוטות אנכיות. כאשר [[x→±∞]], [[f→∞]] ולכן גם [[√f→∞]] — אין אופקית.`],
  ext:[`מינימום (קצה): [[(1, 0)]], [[(3, 0)]]`,`המינימום של f, [[(2, −1)]], מתחת לציר x — מחוץ לתחום של h, ולכן “נעלם”.<br>בקצות התחום [[h=0]], הערך הנמוך ביותר — מינימום קצה. h יורדת ב־[[x≤1]] ועולה ב־[[x≥3]], כמו f.`],
  sketch:`<ol><li>סמנו [[(1, 0)]], [[(3, 0)]], ואת [[(0, √3) ≈ (0, 1.73)]] (כי [[f(0)=3]]); מסימטריה גם [[(4, √3)]].</li><li>[[x≤1]]: הגרף יורד עד [[(1, 0)]] ומגיע אליה כמעט אנכית.</li><li>[[x≥3]]: יוצא מ־[[(3, 0)]] כמעט אנכית ועולה.</li><li>בין 1 ל־3 אין גרף.</li></ol>`}}},

/* 2 */
{f:x=>(x-1)*(x-1),fx:[-3,5],fy:[-1,6],
 fF:{pts:[[1,0,'(1,0)','b'],[0,1,'(0,1)','bl'],[2,1,'(2,1)','br'],[3,4,'(3,4)','br'],[-1,4,'(−1,4)','bl']]},
 inv:{y:[-1,4],B:[1],F:{va:[[1,'x=1']],ha:[[0,'y=0']],pts:[[0,1,'(0,1)','tl'],[2,1,'(2,1)','tr'],[3,0.25,'(3,¼)','t'],[-1,0.25,'(−1,¼)','t']]},q:{
  domain:[`[[x≠1]]`,`f מתאפסת רק בקודקוד, ב־[[x=1]] — אסור לחלק ב־0.`],
  sign:[`חיובית לכל [[x≠1]]<br>שלילית: אין`,`f חיובית בכל מקום חוץ מהקודקוד, ולכן גם g (אותו סימן).`],
  asym:[`אנכית: [[x=1]]<br>אופקית: [[y=0]]`,`<b>אנכית:</b> f נוגעת בציר בקודקוד — חיובית משני הצדדים — ולכן [[g→+∞]] <b>משני הצדדים</b>.<br><b>אופקית:</b> [[f→+∞]] בשני הקצוות, ולכן [[g→0]] (מעל ציר x).`],
  ext:[`אין נקודות קיצון`,`המינימום של f נמצא על ציר x ([[f=0]]), ולכן הוא לא הופך לקיצון של g אלא לאסימפטוטה אנכית.<br>f יורדת ב־[[x<1]] ולכן g עולה; f עולה ב־[[x>1]] ולכן g יורדת.`],
  sketch:`<ol><li>שרטטו [[x=1]], [[y=0]].</li><li>סמנו [[(0, 1)]], [[(2, 1)]] (נקודות שבהן [[f=1]] לא זזות) ו־[[(3, ¼)]], [[(−1, ¼)]].</li><li>[[x<1]]: g עולה מ־0 ל־[[+∞]].</li><li>[[x>1]]: g יורדת מ־[[+∞]] לכיוון 0.</li></ol>💡 שני הענפים מעל ציר x ושואפים יחד ל־[[+∞]].`}},

function mathHTML(src){
  const s=src.replace(/-/g,'−');let i=0;
  const frac=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
  const join=a=>a.map(t=>t.h).join('');

  const P=e[p],fn=p==='inv'?inv(e.f):sq(e.f),nm=p==='inv'?'g':'h';
  return `<span class="tag">הגרף של <span class="m">${nm}</span></span>`+plot({xr:e.fx,yr:P.y,va:P.F.va,ha:P.F.ha,pts:P.F.pts,holes:P.F.holes,pc:p==='inv'?'g':'h',aria:'גרף הפונקציה '+nm,
    curves:[{fn:e.f,cls:'cfaint',breaks:e.fB},{fn,cls:p==='inv'?'cg':'ch',breaks:P.B,extra:P.X}]})+
    `<div class="legend"><span><i></i><span class="m">${nm}(x)</span></span><span><i class="f"></i><span class="m">f(x)</span> לשם השוואה</span></div>`;
}

/* ---------- summaries ---------- */
function row(title,rule,why,extra){return `<div class="row"><h3>${title}</h3><div><div class="rule">${M(rule)}</div>${extra?M(extra):''}${why?`<div class="why">${M(why)}</div>`:''}</div></div>`}
function renderSummaries(){
  const fA=x=>(x-1)*(x-3);
  const exInv=plot({xr:[-1.5,5.5],yr:[-3,4],h:300,va:[[1,'x=1'],[3,'x=3']],ha:[[0,'y=0']],pc:'g',pts:[[2,-1,'(2,−1)','b']],aria:'דוגמה: f ו־1/f',
    curves:[{fn:fA,cls:'cfaint'},{fn:inv(fA),cls:'cg',breaks:[1,3]}]});
  const fB=x=>(x-1)*(x-1)*(x+2);
  const exSq=plot({xr:[-4,3],yr:[-2,5],h:300,pc:'h',pts:[[-2,0,'(−2,0)','b'],[-1,2,'(−1,2)','t'],[1,0,'(1,0)','b']],aria:'דוגמה: f ו־√f',
    curves:[{fn:fB,cls:'cfaint'},{fn:sq(fB),cls:'ch',extra:[-2,1]}]});

  document.getElementById('v-inv').innerHTML=`
  <div class="sumhead"><div><h2>סיכום: אחד חלקי פונקציה</h2><p>מה קורה לגרף של <span class="m">f</span> כשעוברים ל־<span class="m">g = 1/f</span></p></div>${FORM.inv}</div>
  <div class="big">הרעיון בקצרה: <b>הסימן נשמר, הכיוון מתהפך.</b> איפה ש־f קרובה ל־0 — g “בורחת” לאינסוף, ואיפה ש־f בורחת לאינסוף — g קרובה ל־0.</div>
  <div class="rows">
   ${row('תחום הגדרה','התחום של f, <b>בלי</b> הנקודות שבהן [[f(x)=0]].','אסור לחלק ב־0.')}
   ${row('חיוביות ושליליות','<b>אותו סימן</b> כמו f. ל־g אין אפסים — הגרף לא חותך את ציר x.','המונה 1 חיובי, ולכן הסימן נקבע לפי המכנה f.')}
   ${row('עלייה וירידה','<b>מתהפכות:</b> כש־f עולה g יורדת, וכש־f יורדת g עולה (בכל קטע שבו [[f≠0]]).','ככל שהמכנה גדל, השבר קטן: [[f: 2 → 4]] נותן [[g: ½ → ¼]].')}
   ${row('נקודות קיצון','<b>סוג:</b> מתהפך — מקסימום הופך למינימום ולהפך.<br><b>שיעורים:</b> אותו x, והגובה החדש הוא [[1/y]].',null,`<ul><li>דוגמה: מינימום [[(2, −4)]] הופך למקסימום [[(2, −¼)]].</li><li>קיצון של f <b>על ציר x</b> (בגובה 0) — לא הופך לקיצון, אלא לאסימפטוטה אנכית.</li></ul>`)}
   ${row('אסימפטוטות אנכיות','כל <b>אפס של f</b> הופך לאסימפטוטה אנכית של g.','קרוב לאפס המכנה זעיר, והשבר ענק.',`<ul><li>כיוון השאיפה ([[+∞]] או [[−∞]]) לפי הסימן של f בכל צד.</li><li>f <b>חוצה</b> את הציר — כיוונים הפוכים משני הצדדים.</li><li>f <b>נוגעת</b> בציר — אותו כיוון משני הצדדים.</li></ul>`)}
   ${row('אסימפטוטות אופקיות','לפי מה ש־f שואפת אליו באינסוף:',null,`<table class="mini"><tr><th>f שואפת ל־</th><th>g שואפת ל־</th><th>מסקנה</th></tr><tr><td>[[±∞]]</td><td>0</td><td>[[y=0]]</td></tr><tr><td>[[c ≠ 0]]</td><td>[[1/c]]</td><td>[[y=1/c]]</td></tr><tr><td>0</td><td>[[±∞]]</td><td>אין אסימפטוטה אופקית</td></tr></table><div class="note">אם f מתקרבת ל־c מלמטה, g מתקרבת ל־[[1/c]] מלמעלה (ולהפך).</div>`)}
   ${row('חורים','שלושה מצבים:',null,`<table class="mini"><tr><th>ב־f</th><th>ב־g</th></tr><tr><td>אסימפטוטה אנכית [[x=a]]</td><td>חור [[(a, 0)]] על ציר x</td></tr><tr><td>חור [[(a, c)]], [[c≠0]]</td><td>חור [[(a, 1/c)]]</td></tr><tr><td>חור [[(a, 0)]]</td><td>אסימפטוטה אנכית [[x=a]]</td></tr></table><div class="why">ליד אסימפטוטה של f, f ענקית ולכן [[1/f]] כמעט 0 — אבל הנקודה עצמה לא בתחום.</div>`)}
   ${row('נקודות שלא זזות','נקודות שבהן [[f=1]] או [[f=−1]].','[[1/1 = 1]] ו־[[1/(−1) = −1]]. נוח לסמן אותן בסקיצה.')}
   ${row('רחוק וקרוב','כש־[[|f|>1]], g קרובה ל־0; כש־[[|f|<1]] (f קרובה לציר), [[|g|]] גדול.',null)}
  </div>
  <div class="example"><h3>דוגמה: <span class="m">f(x) = (x−1)(x−3)</span> ו־<span class="m">g = 1/f</span></h3>${exInv}<div class="legend" style="--acc:var(--gc)"><span><i></i><span class="m">g(x)</span></span><span><i class="f"></i><span class="m">f(x)</span></span></div></div>`;

  document.getElementById('v-sqrt').innerHTML=`
  <div class="sumhead"><div><h2>סיכום: שורש של פונקציה</h2><p>מה קורה לגרף של <span class="m">f</span> כשעוברים ל־<span class="m">h = √f</span></p></div>${FORM.sqrt}</div>
  <div class="big">הרעיון בקצרה: <b>מה שמתחת לציר x נעלם, וכל השאר שומר על הצורה.</b> עלייה, ירידה וסוג הקיצון נשמרים — רק הגבהים הופכים לשורש שלהם.</div>
  <div class="rows">
   ${row('תחום הגדרה','היכן ש־f מוגדרת <b>וגם</b> [[f(x) ≥ 0]]. האפסים של f נכללים.','אין שורש למספר שלילי.')}
   ${row('חיוביות ושליליות','<b>אף פעם לא שלילית:</b> חיובית היכן ש־[[f>0]], ומתאפסת באותם אפסים של f.','שורש הוא תמיד מספר אי־שלילי, ו־[[√0 = 0]].')}
   ${row('עלייה וירידה','<b>נשמרות:</b> כש־f עולה h עולה, וכש־f יורדת h יורדת (בתוך התחום).','√ היא פונקציה עולה — מספר גדול יותר, שורש גדול יותר: [[f: 4 → 9]] נותן [[h: 2 → 3]].')}
   ${row('נקודות קיצון','<b>סוג:</b> נשמר — מקסימום נשאר מקסימום ומינימום נשאר מינימום.<br><b>שיעורים:</b> אותו x, והגובה החדש הוא [[√y]].',null,`<ul><li>דוגמה: מקסימום [[(−1, 4)]] הופך למקסימום [[(−1, 2)]].</li><li>קיצון של f <b>מתחת לציר x</b> — נעלם, כי הוא מחוץ לתחום.</li><li>אפס של f בקצה התחום — הופך ל<b>מינימום קצה</b> [[(a, 0)]].</li></ul>`)}
   ${row('אסימפטוטות אנכיות','אסימפטוטה אנכית של f שבה [[f→+∞]] נשארת אסימפטוטה אנכית של h.','כש־f ענקית, גם השורש שלה ענק.',`<ul><li>נשארת רק מהצד שבו [[f>0]].</li><li>בצד שבו [[f→−∞]] — h לא מוגדרת, ואין שם אסימפטוטה.</li><li>אפסים של f <b>לא</b> יוצרים אסימפטוטות — הם נשארים אפסים.</li></ul>`)}
   ${row('אסימפטוטות אופקיות','לפי מה ש־f שואפת אליו באינסוף:',null,`<table class="mini"><tr><th>f שואפת ל־</th><th>h שואפת ל־</th><th>מסקנה</th></tr><tr><td>[[c > 0]]</td><td>[[√c]]</td><td>[[y=√c]]</td></tr><tr><td>0</td><td>0</td><td>[[y=0]]</td></tr><tr><td>[[+∞]]</td><td>[[+∞]]</td><td>אין אסימפטוטה אופקית</td></tr></table><div class="note">אם f מתקרבת ל־c מלמטה, גם h מתקרבת ל־[[√c]] מלמטה (ולהפך).</div>`)}
   ${row('חורים','שלושה מצבים:',null,`<table class="mini"><tr><th>ב־f</th><th>ב־h</th></tr><tr><td>חור [[(a, c)]], [[c>0]]</td><td>חור [[(a, √c)]]</td></tr><tr><td>חור [[(a, 0)]]</td><td>חור [[(a, 0)]]</td></tr><tr><td>חור [[(a, c)]], [[c<0]]</td><td>אין — הנקודה מחוץ לתחום</td></tr></table><div class="why">ליד החור f קרובה ל־c, ולכן h קרובה ל־[[√c]] — אבל הנקודה עצמה לא בתחום.</div>`)}
   ${row('נקודות שלא זזות','נקודות שבהן [[f=0]] או [[f=1]].','[[√0 = 0]] ו־[[√1 = 1]]. נוח לסמן אותן בסקיצה.')}
   ${row('גבוה ונמוך','כש־[[0<f<1]], h גבוהה מ־f ([[√0.25 = 0.5]]); כש־[[f>1]], h נמוכה מ־f ([[√9 = 3]]).',null)}
  </div>
  <div class="example"><h3>דוגמה: <span class="m">f(x) = (x−1)²(x+2)</span> ו־<span class="m">h = √f</span></h3>${exSq}<div class="legend" style="--acc:var(--hc)"><span><i></i><span class="m">h(x)</span></span><span><i class="f"></i><span class="m">f(x)</span></span></div></div>`;
}

function setView(v){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.view===v));
  document.getElementById('v-ex').hidden=v!=='ex';
  document.getElementById('v-inv').hidden=v!=='inv';
  document.getElementById('v-sqrt').hidden=v!=='sqrt';
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.view){setView(b.dataset.view);return}
  if(b.dataset.i!==undefined){cur=+b.dataset.i;renderPills();renderCard();return}
  if(b.dataset.p){const p=document.getElementById(b.dataset.p),open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',!open);p.hidden=open;return}
  if(b.id==='prev'&&cur>0){cur--;renderPills();renderCard();document.getElementById('card').scrollIntoView({block:'start'});return}
  if(b.id==='next'&&cur<E.length-1){cur++;renderPills();renderCard();document.getElementById('card').scrollIntoView({block:'start'});return}
});
renderPills();renderCard();renderSummaries();TS();
</script>
</body>
</html>
